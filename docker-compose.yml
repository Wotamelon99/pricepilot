services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: pricepilot
      POSTGRES_PASSWORD: pricepilot
      POSTGRES_DB: pricepilot
    ports:
      - "5432:5432"
    volumes:
      - pricepilot_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pricepilot -d pricepilot"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: packages/backend/Dockerfile
    env_file:
      - packages/backend/.env
    environment:
      DATABASE_URL: postgres://pricepilot:pricepilot@postgres:5432/pricepilot
      REDIS_URL: redis://redis:6379
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pricepilot_pgdata:
